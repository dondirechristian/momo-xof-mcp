[project]
name = "momo-xof-mcp"
version = "0.1.0"
description = "MCP server for West African mobile money (XOF zone) — Orange Money, Moov Money, Wave"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Aristide Dondire", email = "christian.dondire@sotechdi.bf" }]
keywords = ["mcp", "mobile-money", "xof", "uemoa", "orange-money", "wave", "africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
momo-xof-mcp = "momo_xof_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momo_xof_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
